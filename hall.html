<script>
  function toggleSound() {
    const on = Sound.toggle();
    document.getElementById('sound-toggle').textContent = on ? '🔊' : '🔇';
  }
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('sound-toggle').textContent = Sound.isEnabled() ? '🔊' : '🔇';
  });
</script>
