<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game · Omok</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#0F172A">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html" class="logo">Omok</a>
    <div class="nav-links">
      <a href="index.html" data-i18n="play">Play</a>
      <a href="rules.html" data-i18n="rules">Rules</a>
      <a href="hall.html" data-i18n="hall_of_fame">Hall of Fame</a>
      <button type="button" class="lang-toggle" id="lang-toggle">한국어</button>
      <button type="button" class="sound-toggle" id="sound-toggle" title="Sound">🔊</button>
    </div>
  </nav>

  <div class="game-container">
    <div class="board-wrapper">
      <div id="board"></div>
    </div>

    <div class="game-info">
      <h3 data-i18n="game_info">Game Info</h3>

      <!-- Rules badge -->
      <div id="rules-badge" class="rules-badge freestyle">Freestyle</div>

      <div class="player-info" id="black-info">
        <div class="player-stone black"></div>
        <span id="black-name">Black</span>
      </div>

      <div class="player-info" id="white-info">
        <div class="player-stone white"></div>
        <span id="white-name">White</span>
      </div>

      <div class="turn-indicator" id="turn-indicator" role="status" aria-live="polite"></div>

      <!-- Bet display (shown when bet exists) -->
      <div class="game-bet-display hidden" id="bet-display">
        <div class="bet-label" data-i18n="bet_label">BET</div>
        <div class="bet-content" id="bet-content"></div>
      </div>

      <div class="local-controls hidden" id="local-controls">
        <button type="button" class="btn btn-secondary btn-small" id="undo-btn" data-i18n="undo">Undo</button>
        <button type="button" class="btn btn-primary btn-small" id="restart-btn" data-i18n="new_game">New game</button>
      </div>

      <button type="button" class="btn btn-secondary btn-small btn-block mt-16" id="leave-btn" data-i18n="leave_game">Leave Game</button>

      <!-- Taunt panel (shown only for winner) -->
      <div class="taunt-panel hidden" id="taunt-panel">
        <h4 data-i18n="taunt_title">Send Taunt</h4>
        <div class="taunt-grid" id="taunt-grid"></div>
        <div class="taunt-custom">
          <input type="text" id="taunt-custom-input" data-i18n="taunt_custom_placeholder" placeholder="Custom taunt message..." maxlength="50">
          <button class="btn btn-primary btn-small" id="taunt-send-btn" data-i18n="send_taunt">Send</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a href="rules.html" data-i18n="rules">Rules</a>
      <a href="hall.html" data-i18n="hall_of_fame">Hall of Fame</a>
      <a href="https://github.com/Jayyo/gomoku" rel="noopener">GitHub</a>
    </div>
    <p data-i18n="footer_note">A side project by Jayyo.</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/lang/en.js"></script>
  <script src="js/lang/ko.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/page.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/local-game.js"></script>
  <script src="js/taunt.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
